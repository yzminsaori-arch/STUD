<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STUD.</title><style>
:root{--wine:#39203f;--purple:#69417f;--lilac:#aa78d4;--pale:#f7f1fb;--line:#ece5f0;--ink:#2e2632;--muted:#827789}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:#fff}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.45;cursor:not-allowed}.btn{padding:12px 19px;border-radius:13px;background:var(--purple);color:white;font-weight:700}.btn:hover{background:var(--wine)}.secondary{background:var(--pale);color:var(--purple)}.ghost{background:transparent;color:var(--purple)}.small{padding:8px 12px;font-size:13px}.brand{width:192px;height:73px;object-fit:contain;object-position:left center}.shell{max-width:1180px;margin:auto;padding:24px}.intro{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 15%,#f0defb,transparent 40%),#fff;padding:20px}.intro-card{width:min(100%,670px);border:1px solid var(--line);border-radius:28px;padding:36px;background:#fff;box-shadow:0 25px 80px #39203f0e}.eyebrow{color:var(--purple);font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.intro h1{font-size:clamp(30px,5vw,49px);line-height:1.13;margin:14px 0}.muted{color:var(--muted)}.step{display:flex;gap:8px;margin:18px 0}.step span{height:6px;flex:1;background:var(--line);border-radius:6px}.step .active{background:var(--lilac)}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:22px 0}.choice{border:2px solid var(--line);border-radius:16px;padding:15px 4px;background:#fff;text-align:center}.choice b{font-size:32px;display:block}.choice.active{border-color:var(--purple);background:var(--pale)}label{display:block;font-size:13px;font-weight:700;margin:13px 0 6px}input,select,textarea{width:100%;border:1px solid #ddd4e3;border-radius:11px;padding:12px;background:white;color:var(--ink)}textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.top{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:2}.topinner{max-width:1180px;margin:auto;padding:8px 24px;display:flex;align-items:center;justify-content:space-between;gap:15px}.top .brand{width:150px;height:57px}.nav{display:flex;gap:5px;flex-wrap:wrap}.nav button{background:transparent;color:var(--muted);padding:11px 15px;border-radius:11px;font-weight:700}.nav button.active{background:var(--pale);color:var(--purple)}.heading{margin:24px 0}.heading h1{font-size:32px;margin:0 0 7px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{border:1px solid var(--line);border-radius:20px;padding:23px;background:#fff}.card h2,.card h3{margin:0 0 10px}.soft{background:var(--pale)}.stat{font-size:29px;color:var(--wine);font-weight:800}.pill{display:inline-block;padding:6px 10px;border-radius:99px;background:#eee0f5;color:var(--purple);font-size:12px;font-weight:700}.pet{font-size:83px;text-align:center;margin:8px 0}.progress{height:10px;background:#e7d9ed;border-radius:30px;overflow:hidden}.progress i{display:block;height:100%;background:var(--lilac)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 15px}.record{border-top:1px solid var(--line);padding:14px 0}.record:first-child{border-top:0}.tiny{font-size:12px}.empty{padding:25px;text-align:center;color:var(--muted);background:#faf7fc;border-radius:14px}.danger{color:#b33c65}.link{color:var(--purple);word-break:break-all}.hidden{display:none!important}.bar{height:12px;background:#f0e8f4;border-radius:6px;overflow:hidden}.bar>span{height:100%;display:block;background:var(--lilac)}.notice{border-left:3px solid var(--lilac);padding:12px;background:var(--pale);border-radius:8px}.footer{font-size:12px;color:var(--muted);text-align:center;padding:30px}.flex1{flex:1}.checkbox{width:auto}.full{grid-column:1/-1}@media(max-width:750px){.grid,.grid.two,.fields{grid-template-columns:1fr}.choices{grid-template-columns:repeat(3,1fr)}.topinner{display:block}.nav{overflow-x:auto;flex-wrap:nowrap}.nav button{white-space:nowrap}.intro-card{padding:22px}.shell{padding:15px}.card{padding:18px}}

.library-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:24px 0 16px}.library-toolbar h2{margin:0 0 4px}.library-toolbar p{margin:0}.folder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:13px}.folder-tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;text-align:left;display:flex;flex-direction:column;gap:7px;min-height:154px;color:var(--ink)}.folder-tile:hover,.folder-tile.selected{border-color:var(--lilac);box-shadow:0 5px 18px #69417f16}.folder-tile.selected{background:#fbf7fe}.folder-art{width:56px;height:56px;border:1px solid transparent;border-radius:15px;display:grid;place-items:center;font-size:29px}.folder-tile strong{font-size:14px;overflow-wrap:anywhere}.folder-tile small{color:var(--muted)}.folder-form{margin:14px 0 22px}.folder-form[hidden]{display:none!important}.color-picks,.emoji-picks{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0 18px}.color-choice{cursor:pointer}.color-choice input{position:absolute;opacity:0;width:1px;height:1px}.color-choice span{display:block;width:34px;height:34px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px #ddd}.color-choice input:checked+span{box-shadow:0 0 0 2px var(--wine)}.emoji-picks button{background:var(--pale);border-radius:10px;padding:8px;font-size:20px}.folder-controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0}.materials-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:17px}.material-card{border:1px solid var(--line);border-radius:19px;padding:15px;min-width:0;display:flex;flex-direction:column;gap:11px;background:white}.material-card h3{font-size:16px;margin:0;overflow-wrap:anywhere}.material-card p{margin:0;overflow-wrap:anywhere}.material-symbol{height:150px;border-radius:13px;background:var(--pale);display:grid;place-items:center;font-size:55px}.video-box{aspect-ratio:16/9;background:#21162b;border-radius:13px;overflow:hidden}.video-preview{position:relative;width:100%;height:100%;padding:0;background:#21162b;display:block}.video-preview img{width:100%;height:100%;object-fit:cover}.play-icon{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:58px;height:42px;border-radius:13px;background:#6b398bdc;color:white;font-size:23px}.video-box iframe{width:100%;height:100%;border:0}.video-fallback{background:var(--pale);border-radius:13px;padding:18px;display:flex;gap:12px;align-items:center;min-height:130px}.video-fallback>span{font-size:32px}.material-actions{margin-top:auto;display:flex;align-items:center;gap:8px}.material-actions select{min-width:0;flex:1;font-size:12px}.library-empty{padding:42px 16px;text-align:center}.library-empty h3{margin:6px}.library-empty p{color:var(--muted)}@media(max-width:560px){.library-toolbar{align-items:flex-start;flex-direction:column}.folder-controls{flex-direction:column;align-items:flex-start}.folder-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

.custom-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.custom-tabs button.active{background:var(--purple);color:#fff}.emoji-draw{border:2px dashed #c9b3d8;border-radius:15px;touch-action:none;background:#fff;max-width:100%;width:220px;height:160px;cursor:crosshair}.exam-card{border:1px solid var(--line);padding:17px;border-radius:16px;margin:12px 0}.exam-progress{display:flex;gap:7px;align-items:center}.exam-progress select{max-width:180px}.meta-status{font-size:12px;color:var(--purple);margin-top:5px}.course-choice{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:10px}.record-year{margin-top:24px}.record-source{border:1px solid var(--line);border-radius:15px;padding:16px;margin:10px 0}.record-source .stat{font-size:24px}.note{background:#f8f4fb;padding:10px 12px;border-radius:10px;font-size:12px;color:var(--muted)}.record-score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:7px}.record-score-grid span{background:var(--pale);padding:8px;border-radius:9px;font-size:12px}.folder-art img{width:46px;height:46px;object-fit:contain}.folder-art{overflow:hidden}.material-card .tiny{line-height:1.5}
</style></head><body><div id="app"></div><script>
const KEY='estude-v1';let db=load(),step=0,answer='',tab='home',editYear=new Date().getFullYear();const animals={gato:'🐱',cachorro:'🐶',papagaio:'🦜',sapo:'🐸',coelho:'🐰'},areas=['Linguagens','Ciências Humanas','Ciências da Natureza','Matemática','Redação'];function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function el(id){return document.getElementById(id)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dateStr(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function daysSince(v){if(!v)return 0;let a=new Date(v+'T12:00:00'),b=new Date(dateStr()+'T12:00:00');return Math.max(0,Math.round((b-a)/86400000))}function studied(){return (db.checkins||[]).includes(dateStr())}function petState(){let n=daysSince(db.checkins?.at(-1)||db.created);return n>30?'Em risco':n>=7?'Doente':n>=2?'Triste':'Feliz'}function stage(){let n=(db.checkins||[]).length;return n<3?'Ovo':n<10?'Filhote':n<25?'Jovem':'Adulto'}function petEmoji(){let s=stage();return s==='Ovo'?'🥚':animals[db.pet]||'🐱'}function logo(){return '<img class="brand" src="logo.png" alt="Logo STUD.">'}function render(){if(!db.user){renderOnboarding();return}el('app').innerHTML=`<header class="top"><div class="topinner">${logo()}<nav class="nav">${[['home','Home'],['enem','ENEM'],['assuntos','Assuntos'],['materiais','Materiais']].map(([id,t])=>`<button class="${tab===id?'active':''}" onclick="setTab('${id}')">${t}</button>`).join('')}</nav><button class="btn secondary small" onclick="logout()">Reiniciar</button></div></header><main class="shell" id="main"></main><footer class="footer">STUD. · Protótipo local · Seus dados ficam neste navegador</footer>`;({home:home,enem:enem,assuntos:assuntos,materiais:materiais}[tab])()}function setTab(t){tab=t;render()}function renderOnboarding(){let body='';if(step===0)body=`<span class="eyebrow">Seu espaço, seu ritmo</span><h1>Organize seus estudos. Acompanhe cada conquista.</h1><p class="muted">Reúna suas notas do ENEM, compare simulados, guarde materiais e cuide de um companheiro virtual que cresce com sua dedicação.</p><div class="grid"><div class="card soft">📊<h3>Notas</h3><p class="tiny">Compare anos e fontes</p></div><div class="card soft">📚<h3>Biblioteca</h3><p class="tiny">Tudo em um lugar</p></div><div class="card soft">🥚<h3>Pet</h3><p class="tiny">Evolua estudando</p></div></div><div class="actions"><button class="btn" onclick="step=1;render()">Começar →</button></div>`;if(step===1)body=`<span class="eyebrow">Passo 1 de 2 · Seu mascote</span><h1>Qual animal combina mais com você?</h1><p class="muted">Escolha seu favorito. O ovo será sorteado com uma chance maior de revelar o animal que você escolheu.</p><div class="choices">${Object.entries(animals).map(([k,e])=>`<button class="choice ${answer===k?'active':''}" onclick="answer='${k}';render()"><b>${e}</b>${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div><p class="tiny muted">Sorteio: 60% para seu favorito e 10% para cada um dos outros quatro.</p><div class="actions"><button class="btn secondary" onclick="step=0;render()">Voltar</button><button class="btn" ${!answer?'disabled':''} onclick="step=2;render()">Continuar →</button></div>`;if(step===2)body=`<span class="eyebrow">Passo 2 de 2 · Seu perfil</span><h1>Seu espaço está quase pronto.</h1><p class="muted">Crie um perfil local para começar. Nesta versão, não existe servidor nem autenticação real.</p><form onsubmit="signup(event)"><label for="name">Como quer ser chamado(a)?</label><input id="name" required minlength="2" maxlength="45" placeholder="Seu nome"><label for="email">E-mail (opcional, apenas identificação)</label><input id="email" type="email" placeholder="voce@exemplo.com"><div class="actions"><button type="button" class="btn secondary" onclick="step=1;render()">Voltar</button><button class="btn" type="submit">Criar meu espaço ✨</button></div></form>`;el('app').innerHTML=`<div class="intro"><section class="intro-card">${logo()}<div class="step"><span class="active"></span><span class="${step>=1?'active':''}"></span><span class="${step>=2?'active':''}"></span></div>${body}</section></div>`}function signup(e){e.preventDefault();let keys=Object.keys(animals),r=Math.random(),pet=r<.6?answer:keys.filter(x=>x!==answer)[Math.floor((r-.6)/.1)]||answer;db={user:el('name').value.trim(),email:el('email').value.trim(),favorite:answer,pet,created:dateStr(),checkins:[],records:[],topics:[],materials:[]};save();render()}function logout(){if(confirm('Apagar todos os dados locais e recomeçar? Esta ação não pode ser desfeita.')){db={};save();step=0;render()}}function head(title,sub){return `<div class="heading"><h1>${title}</h1><div class="muted">${sub}</div></div>`}function courseCards(){let choices=db.choices||[{},{}];return `<section class="card" style="margin-top:18px"><h2>🎓 Meus cursos desejados</h2><p class="muted tiny">Cadastre duas opções para acompanhar suas metas no ENEM. As chances dependem de notas de corte e pesos oficiais.</p><div class="grid two">${choices.map((c,i)=>`<div class="course-choice"><strong>${i+1}ª opção</strong><form onsubmit="saveChoice(event,${i})"><label>Curso</label><input id="course${i}" maxlength="90" value="${esc(c.course||'')}" placeholder="Ex.: Direito" required><label>Universidade</label><input id="uni${i}" maxlength="100" value="${esc(c.uni||'')}" placeholder="Ex.: UFBA" required><div class="fields"><div><label>Cidade</label><input id="city${i}" value="${esc(c.city||'')}" required></div><div><label>Estado (UF)</label><input id="uf${i}" maxlength="2" value="${esc(c.uf||'')}" placeholder="BA" required></div></div><label>Nota de corte de referência (opcional)</label><input id="cut${i}" type="number" min="0" max="1000" step="0.01" value="${esc(c.cut||'')}" placeholder="Ex.: 750"><p class="tiny muted">Informe uma nota de corte verificada e os pesos adequados para uma comparação útil.</p><button class="btn small">Salvar opção</button></form></div>`).join('')}</div></section>`}
function saveChoice(e,i){e.preventDefault();db.choices=db.choices||[{},{}];db.choices[i]={course:el('course'+i).value.trim(),uni:el('uni'+i).value.trim(),city:el('city'+i).value.trim(),uf:el('uf'+i).value.trim().toUpperCase(),cut:el('cut'+i).value};save();home()}
function home(){let checks=db.checkins||[],n=checks.length,s=stage(),state=petState();el('main').innerHTML=head('Olá, '+esc(db.user)+'! 👋','Seu cantinho para aprender e evoluir, um dia de cada vez.')+`<div class="grid"><section class="card soft"><div class="eyebrow">Seu companheiro</div><div class="pet">${petEmoji()}</div><h2 style="text-align:center">${s==='Ovo'?'Seu ovo está incubando':esc(db.pet[0].toUpperCase()+db.pet.slice(1))}</h2><p class="muted" style="text-align:center">Estado: <strong>${state}</strong> · Fase: ${s}</p><div class="progress"><i style="width:${Math.min(100,n/25*100)}%"></i></div><p class="tiny muted">${n} dia(s) de estudo registrado(s). Ovo choca após 3 dias de estudo.</p><button class="btn" style="width:100%" ${studied()?'disabled':''} onclick="checkin()">${studied()?'✓ Estudo registrado hoje':'✓ Registrar estudo de hoje'}</button><p class="tiny muted">Check-in de estudo é manual. Após 2 dias sem estudar o pet fica triste; após 7, doente; após 31, em risco. Não há morte automática nesta versão.</p></section><section class="card"><h2>Seu progresso</h2><div class="stat">${n}</div><p class="muted">dias com estudo registrado</p><div class="stat">${(db.records||[]).length}</div><p class="muted">resultados do ENEM cadastrados</p><div class="stat">${(db.topics||[]).length}</div><p class="muted">assuntos organizados</p></section><section class="card"><h2>Explore o STUD.</h2><p>📊 <strong>ENEM</strong><br><span class="muted">Compare notas de sites, simulados e anos.</span></p><p>🧠 <strong>Assuntos</strong><br><span class="muted">Acompanhe cada conteúdo estudado.</span></p><p>📚 <strong>Materiais</strong><br><span class="muted">Salve links, vídeos, livros e anotações.</span></p><div class="actions"><button class="btn secondary" onclick="setTab('enem')">Ir para o ENEM →</button></div></section></div>${courseCards()}`}function checkin(){if(studied())return;db.checkins=[...(db.checkins||[]),dateStr()].sort();save();home()}function courseComparison(rec){let choices=(db.choices||[]).filter(c=>c.course&&c.uni);if(!choices.length)return '<p class="note">Defina seus cursos desejados na Home para comparar seus resultados.</p>';let latest=rec.at(-1);return `<section class="card" style="margin-bottom:18px"><h2>🎯 Suas opções de curso</h2><p class="tiny muted">Comparação indicativa usando a média simples mais recente. Não é probabilidade de aprovação: o SiSU pode usar pesos, modalidades, bônus e notas de corte variáveis.</p><div class="grid two">${choices.map((c,i)=>{let cut=Number(c.cut),hasCut=c.cut!==''&&c.cut!=null&&Number.isFinite(cut);let diff=latest&&hasCut?latest.average-cut:null;return `<div class="course-choice"><strong>${i+1}ª opção · ${esc(c.course)}</strong><p class="tiny">${esc(c.uni)} · ${esc(c.city)}/${esc(c.uf)}</p><span class="pill">${!latest?'Cadastre notas':!hasCut?'Sem nota de corte':diff>=0?'Acima da referência':'Abaixo da referência'}</span>${diff!==null?`<p class="tiny">Diferença para a referência: <strong>${diff>=0?'+':''}${diff.toFixed(2).replace('.',',')} pontos</strong></p>`:''}</div>`}).join('')}</div><p class="note">A nota de corte é informada manualmente pelo usuário. Para uma comparação de classificação, confira pesos e modalidade no edital da instituição.</p></section>`}
function enem(){let rec=db.records||[];let years=[...new Set(rec.map(r=>r.year))].sort((a,b)=>b-a);el('main').innerHTML=head('Minhas notas do ENEM','Compare anos, fontes e suas duas opções de curso.')+courseComparison(rec)+`<div class="grid two"><section class="card"><h2>Novo resultado</h2><form onsubmit="addRecord(event)"><label>Ano</label><select id="year">${Array.from({length:17},(_,i)=>new Date().getFullYear()-i).map(y=>`<option ${y===editYear?'selected':''}>${y}</option>`).join('')}</select><label>Nome do site ou simulado</label><input id="source" required maxlength="90" placeholder="Ex.: Simulado de novembro"><label>Link do site (opcional)</label><input id="sourceUrl" type="url" placeholder="https://exemplo.com">${areas.map((a,i)=>`<label>${a}</label><input id="score${i}" type="number" min="0" max="1000" step="0.01" required placeholder="0 a 1000" oninput="calc()">`).join('')}<div class="card soft" style="margin-top:18px"><span class="muted">Média simples</span><div class="stat" id="average">—</div><span class="tiny muted">(Soma das cinco notas) ÷ 5</span></div><div class="actions"><button class="btn">Salvar resultado</button></div></form></section><section class="card"><h2>Resultados por ano e fonte</h2><p class="tiny muted">Cada fonte tem seu próprio cartão. Média simples não equivale necessariamente à nota SiSU.</p>${years.length?years.map(y=>`<div class="record-year"><h3>📅 ENEM ${y}</h3>${rec.filter(r=>r.year===y).slice().reverse().map(r=>`<article class="record-source"><div class="row"><strong>${esc(r.source)}</strong><div class="stat">${r.average.toFixed(2).replace('.',',')}</div></div><div class="record-score-grid">${areas.map((a,i)=>`<span>${esc(a)}<br><strong>${r.scores[i].toLocaleString('pt-BR')}</strong></span>`).join('')}</div><div class="actions">${safeUrl(r.url)?`<a class="link tiny" href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener noreferrer">Abrir fonte ↗</a>`:''}<button class="btn ghost small" onclick="removeRecord('${r.id}')">Excluir</button></div></article>`).join('')}</div>`).join(''):'<div class="empty">Nenhum resultado salvo ainda.</div>'}</section></div>`}
function calc(){let nums=areas.map((_,i)=>el('score'+i).value);el('average').textContent=nums.every(x=>x!==''&&Number(x)>=0&&Number(x)<=1000)?(nums.reduce((s,x)=>s+Number(x),0)/5).toFixed(2).replace('.',','):'—'}function addRecord(e){e.preventDefault();let scores=areas.map((_,i)=>Number(el('score'+i).value));if(scores.some(x=>!Number.isFinite(x)||x<0||x>1000))return alert('Insira notas de 0 a 1000.');let url=el('sourceUrl').value.trim();if(url&&!/^https?:\/\//i.test(url))return alert('Use um link http ou https.');editYear=Number(el('year').value);db.records.push({id:crypto.randomUUID(),year:editYear,source:el('source').value.trim(),url,scores,average:scores.reduce((s,x)=>s+x,0)/5});save();enem()}function removeRecord(id){if(confirm('Excluir este resultado?')){db.records=db.records.filter(x=>x.id!==id);save();enem()}}function assuntos(){db.exams=db.exams||[];el('main').innerHTML=head('Assuntos e provas','Acompanhe conteúdos e provas separadamente.')+`<div class="grid two"><section class="card"><h2>Adicionar assunto</h2><form onsubmit="addTopic(event)"><label>Disciplina</label><input id="subject" required maxlength="70" placeholder="Ex.: Matemática"><label>Assunto</label><input id="topic" required maxlength="100" placeholder="Ex.: Funções do 2º grau"><label>Status</label><select id="status"><option>Pendente</option><option>Em andamento</option><option>Concluído</option></select><div class="actions"><button class="btn">Adicionar assunto</button></div></form></section><section class="card"><h2>📋 Minhas provas</h2><form onsubmit="addExam(event)"><label>Nome da prova e ano</label><input id="examName" required maxlength="120" placeholder="Ex.: ENEM 2023 · Caderno azul"><label>Link da prova</label><input id="examUrl" type="url" required placeholder="https://..."><label>Disciplina (opcional)</label><input id="examSubject" placeholder="Ex.: Matemática"><button class="btn" style="margin-top:15px">Adicionar prova</button></form>${db.exams.map(x=>`<article class="exam-card"><strong>📄 ${esc(x.name)}</strong><p class="tiny muted">${esc(x.subject||'Prova completa')}</p><a class="link tiny" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer">Abrir prova ↗</a><div class="exam-progress"><select aria-label="Progresso da prova" onchange="updateExam('${x.id}',this.value)">${['Não iniciada','Metade feita','Concluída'].map(v=>`<option ${x.status===v?'selected':''}>${v}</option>`).join('')}</select><button class="btn ghost small" onclick="removeExam('${x.id}')">Excluir</button></div></article>`).join('')}</section></div><section class="card" style="margin-top:18px"><h2>🧠 Meus assuntos</h2>${(db.topics||[]).length?db.topics.map(t=>`<div class="record"><div class="row"><div><strong>${esc(t.title)}</strong><div class="tiny muted">${esc(t.subject)}</div></div><span class="pill">${esc(t.status)}</span></div><div class="actions"><select style="max-width:200px" onchange="updateTopic('${t.id}',this.value)">${['Pendente','Em andamento','Concluído'].map(v=>`<option ${t.status===v?'selected':''}>${v}</option>`).join('')}</select><button class="btn ghost small" onclick="removeTopic('${t.id}')">Excluir</button></div></div>`).join(''):'<div class="empty">Nenhum assunto cadastrado.</div>'}</section>`}
function addExam(e){e.preventDefault();let u=safeUrl(el('examUrl').value);if(!u)return alert('Insira um link válido');db.exams=db.exams||[];db.exams.push({id:crypto.randomUUID(),name:el('examName').value.trim(),url:u,subject:el('examSubject').value.trim(),status:'Não iniciada'});save();assuntos()}
function updateExam(id,status){let x=db.exams.find(x=>x.id===id);if(x)x.status=status;save();assuntos()}
function removeExam(id){db.exams=db.exams.filter(x=>x.id!==id);save();assuntos()}
function addTopic(e){e.preventDefault();db.topics.push({id:crypto.randomUUID(),subject:el('subject').value.trim(),title:el('topic').value.trim(),status:el('status').value});save();assuntos()}
function updateTopic(id,status){let t=db.topics.find(x=>x.id===id);if(t)t.status=status;save();assuntos()}
function removeTopic(id){db.topics=db.topics.filter(x=>x.id!==id);save();assuntos()}
let currentFolder='all';
const folderColors=['#EF4444','#F97316','#F59E0B','#EAB308','#22C55E','#14B8A6','#06B6D4','#3B82F6','#6366F1','#8B5CF6','#EC4899','#F43F5E','#111827','#64748B','#FFFFFF','#AA78D4','#69417F','#D58BA7','#80B5AD','#E6B567','#819AD5','#D68C76','#7B719B'];
const folderEmojis=['📁','📚','🧠','📐','🧪','🌎','✍️','🎯','💜','📝','🎨','💻','⭐','🔬','📖','🎬'];
function safeUrl(u){try{let x=new URL(u);return ['http:','https:'].includes(x.protocol)?x.href:''}catch{return ''}}
function youtubeId(u){try{let x=new URL(u);let host=x.hostname.toLowerCase().replace(/^www\./,'');let id='';if(host==='youtu.be')id=x.pathname.split('/')[1];else if(['youtube.com','m.youtube.com','music.youtube.com','youtube-nocookie.com'].includes(host)){if(x.pathname==='/watch')id=x.searchParams.get('v');else if(/^\/(shorts|embed|live)\//.test(x.pathname))id=x.pathname.split('/')[2]}return /^[A-Za-z0-9_-]{11}$/.test(id||'')?id:null}catch{return null}}
function folderVisual(f){return f.iconData&&/^data:image\/png;base64,/.test(f.iconData)?`<img src="${f.iconData}" alt="Ícone personalizado">`:esc(f.emoji)}
function folderOptions(selected){return '<option value="">📚 Sem pasta</option>'+(db.folders||[]).map(f=>`<option value="${esc(f.id)}" ${f.id===selected?'selected':''}>${esc(f.emoji)} ${esc(f.name)}</option>`).join('')}
function videoCard(m){let id=youtubeId(m.url);let u=safeUrl(m.url);if(id)return `<div class="video-box" id="video-${m.id}"><button type="button" class="video-preview" onclick="playVideo('${id}','${m.id}')" aria-label="Reproduzir ${esc(m.title)}"><img loading="lazy" src="https://img.youtube.com/vi/${id}/hqdefault.jpg" alt="Miniatura de ${esc(m.title)}"><span class="play-icon">▶</span></button></div>`;return u?`<div class="video-fallback"><span>🎬</span><div><strong>Vídeo externo</strong><div class="tiny muted">Prévia indisponível para este endereço.</div><a class="link tiny" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Assistir na plataforma ↗</a></div></div>`:''}
function playVideo(id,mid){let box=el('video-'+mid);if(!box)return;box.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1" title="Reprodutor de vídeo" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen loading="lazy"></iframe>`}
function materialCard(m){let f=(db.folders||[]).find(x=>x.id===m.folderId);return `<article class="material-card"><div class="row"><span class="pill">${esc(m.type)}</span>${f?`<span class="tiny muted">${esc(f.emoji)} ${esc(f.name)}</span>`:''}</div>${m.type==='Vídeo'?videoCard(m):`<div class="material-symbol">${{'Livro':'📖','PDF':'📄','Site':'🌐','Anotação':'📝'}[m.type]||'📎'}</div>`}<h3>${esc(m.title)}</h3>${m.subject?`<div class="tiny muted">${esc(m.subject)}</div>`:''}${m.notes?`<p class="tiny">${esc(m.notes)}</p>`:''}${m.type!=='Vídeo'&&safeUrl(m.url)?`<a class="link tiny" href="${esc(safeUrl(m.url))}" target="_blank" rel="noopener noreferrer">Abrir material ↗</a>`:''}<div class="material-actions"><select aria-label="Mover para pasta" onchange="moveMaterial('${m.id}',this.value)">${folderOptions(m.folderId||'')}</select><button class="btn ghost small" onclick="removeMaterial('${m.id}')" aria-label="Excluir material">Excluir</button></div></article>`}
function materiais(){db.folders=db.folders||[];db.materials=db.materials||[];if(currentFolder!=='all'&&currentFolder!=='none'&&!db.folders.some(f=>f.id===currentFolder))currentFolder='all';let shown=db.materials.filter(m=>currentFolder==='all'||(currentFolder==='none'?!m.folderId:m.folderId===currentFolder));let selected=db.folders.find(f=>f.id===currentFolder);el('main').innerHTML=head('Minha biblioteca','Organize seus materiais em pastas personalizadas e assista às aulas sem sair do STUD.')+`<div class="library-toolbar"><div><h2>Suas pastas</h2><p class="tiny muted">Escolha uma pasta para ver os materiais dela.</p></div><button class="btn" onclick="toggleFolderForm()">＋ Nova pasta</button></div><section id="folderForm" class="card folder-form" hidden><h3>Personalizar pasta</h3><form onsubmit="addFolder(event)"><div class="grid two"><div><label>Nome da pasta</label><input id="folderName" required maxlength="45" placeholder="Ex.: Matemática"></div><div><label>Emoji ou ícone</label><input id="folderEmoji" maxlength="8" value="📚" placeholder="📚"></div></div><label>Escolha uma cor</label><div class="color-picks">${folderColors.map((c,i)=>`<label class="color-choice"><input type="radio" name="folderColor" value="${c}" onchange="el('customColor').value=this.value" ${i===0?'checked':''}><span style="background:${c}" onclick="el('customColor').value='${c}'"></span></label>`).join('')}</div><label>Cor personalizada</label><input id="customColor" type="color" value="#AA78D4" style="width:90px;height:48px;padding:4px"><label>Ícone / emoji</label><div class="custom-tabs"><button type="button" class="btn small secondary active" id="emojiTab" onclick="switchIconTab('emoji')">Emojis</button><button type="button" class="btn small secondary" id="drawTab" onclick="switchIconTab('draw')">Desenhar meu ícone</button></div><div id="emojiPanel"><label>Emojis sugeridos</label><div class="emoji-picks">${folderEmojis.map(e=>`<button type="button" onclick="el('folderEmoji').value='${e}'">${e}</button>`).join('')}</div></div><div id="drawPanel" class="hidden"><p class="tiny muted">Desenhe seu ícone usando mouse ou toque. O desenho será salvo na pasta.</p><canvas id="iconCanvas" class="emoji-draw" width="220" height="160"></canvas><div class="actions"><button type="button" class="btn secondary small" onclick="clearIcon()">Limpar desenho</button></div></div><div class="actions"><button class="btn">Criar pasta</button><button type="button" class="btn secondary" onclick="toggleFolderForm()">Cancelar</button></div></form></section><div class="folder-grid"><button class="folder-tile ${currentFolder==='all'?'selected':''}" onclick="currentFolder='all';materiais()"><span class="folder-art" style="background:#f0e8f6;color:#69417f">🗂️</span><strong>Todos</strong><small>${db.materials.length} materiais</small></button>${db.folders.map(f=>`<button class="folder-tile ${currentFolder===f.id?'selected':''}" onclick="currentFolder='${f.id}';materiais()"><span class="folder-art" style="background:${esc(f.color)}22;border-color:${esc(f.color)}55">${folderVisual(f)}</span><strong>${esc(f.name)}</strong><small>${db.materials.filter(m=>m.folderId===f.id).length} materiais</small></button>`).join('')}<button class="folder-tile ${currentFolder==='none'?'selected':''}" onclick="currentFolder='none';materiais()"><span class="folder-art" style="background:#f6f3f7">📎</span><strong>Sem pasta</strong><small>${db.materials.filter(m=>!m.folderId).length} materiais</small></button></div>${selected?`<div class="folder-controls"><strong>${esc(selected.emoji)} ${esc(selected.name)}</strong><div><button class="btn secondary small" onclick="renameFolder('${selected.id}')">Renomear</button> <button class="btn ghost small" onclick="deleteFolder('${selected.id}')">Excluir pasta</button></div></div>`:''}<div class="library-toolbar"><div><h2>${selected?esc(selected.name):currentFolder==='none'?'Sem pasta':'Materiais salvos'}</h2><p class="tiny muted">${shown.length} ${shown.length===1?'material':'materiais'}</p></div><button class="btn secondary" onclick="toggleMaterialForm()">＋ Adicionar material</button></div><section class="card folder-form" id="materialForm" hidden><h3>Novo material</h3><form onsubmit="addMaterial(event)"><div class="grid two"><div><label>Título</label><input id="matTitle" maxlength="120" placeholder="Ex.: Aula de trigonometria"></div><div><label>Tipo</label><select id="matType"><option>Vídeo</option><option>Livro</option><option>PDF</option><option>Site</option><option>Anotação</option></select></div><div><label>Pasta</label><select id="matFolder">${folderOptions(selected?.id||'')}</select></div><div><label>Disciplina ou assunto</label><input id="matSubject" maxlength="80" placeholder="Ex.: Matemática"></div></div><label>Link do material</label><input id="matUrl" type="url" oninput="scheduleMetadata()" placeholder="https://youtube.com/watch?v=..."><div id="metaStatus" class="meta-status" aria-live="polite">Cole um link para tentar preencher o título e organizar automaticamente.</div><p class="tiny muted">Para vídeos do YouTube, a miniatura aparece automaticamente. Clique nela para assistir aqui.</p><label>Observações</label><textarea id="matNotes" maxlength="1000" placeholder="Observações e descrição do material..."></textarea><p class="tiny muted">Observações automáticas são geradas apenas a partir dos metadados disponíveis, não de uma análise do vídeo completo.</p><div class="actions"><button class="btn">Salvar material</button><button type="button" class="btn secondary" onclick="toggleMaterialForm()">Cancelar</button></div></form></section>${shown.length?`<div class="materials-grid">${shown.slice().reverse().map(materialCard).join('')}</div>`:`<div class="empty library-empty">📚<h3>Esta pasta ainda está vazia</h3><p>Adicione vídeos, livros e outros materiais para começar.</p><button class="btn secondary" onclick="toggleMaterialForm()">Adicionar material</button></div>`}`}
function toggleFolderForm(){let x=el('folderForm');x.hidden=!x.hidden;if(!x.hidden)x.scrollIntoView({behavior:'smooth',block:'nearest'})}
function toggleMaterialForm(){let x=el('materialForm');x.hidden=!x.hidden;if(!x.hidden)x.scrollIntoView({behavior:'smooth',block:'nearest'})}
let iconMode='emoji',drawing=false,hasDrawing=false;
function switchIconTab(mode){iconMode=mode;el('emojiPanel').classList.toggle('hidden',mode!=='emoji');el('drawPanel').classList.toggle('hidden',mode!=='draw');el('emojiTab').classList.toggle('active',mode==='emoji');el('drawTab').classList.toggle('active',mode==='draw');if(mode==='draw')setupCanvas()}
function setupCanvas(){let c=el('iconCanvas');if(!c||c.dataset.ready)return;c.dataset.ready='1';let ctx=c.getContext('2d');ctx.lineWidth=5;ctx.lineCap='round';ctx.strokeStyle='#69417F';function pos(e){let r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}c.addEventListener('pointerdown',e=>{drawing=true;hasDrawing=true;c.setPointerCapture(e.pointerId);let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.01,p.y+.01);ctx.stroke()});c.addEventListener('pointermove',e=>{if(!drawing)return;let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()});c.addEventListener('pointerup',()=>drawing=false);c.addEventListener('pointercancel',()=>drawing=false)}
function clearIcon(){let c=el('iconCanvas');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height);hasDrawing=false}
function addFolder(e){e.preventDefault();let name=el('folderName').value.trim(),emoji=el('folderEmoji').value.trim()||'📁',color=el('customColor').value||document.querySelector('input[name="folderColor"]:checked')?.value||folderColors[0];if(!name)return;let id=crypto.randomUUID();db.folders.push({id,name,emoji,color,iconData:iconMode==='draw'&&hasDrawing?el('iconCanvas').toDataURL('image/png'):null});iconMode='emoji';hasDrawing=false;currentFolder=id;save();materiais()}
function renameFolder(id){let f=db.folders.find(x=>x.id===id);if(!f)return;let name=prompt('Novo nome da pasta:',f.name);if(name===null)return;name=name.trim().slice(0,45);if(!name)return;f.name=name;save();materiais()}
function deleteFolder(id){if(!confirm('Excluir esta pasta? Os materiais serão mantidos em "Sem pasta".'))return;db.folders=db.folders.filter(x=>x.id!==id);db.materials.forEach(m=>{if(m.folderId===id)m.folderId=''});currentFolder='all';save();materiais()}
function moveMaterial(id,folderId){let m=db.materials.find(x=>x.id===id);if(!m)return;m.folderId=folderId;save();materiais()}
let metaTimer=null,metaVersion=0;
const categories=[{name:'Matemática',re:/matem[aá]tica|trigonom|proje[cç][aã]o ortogonal|geometr|[aá]lgebra|equa[cç][aã]o|fun[cç][aã]o|logarit|estat[ií]stica|probabilid|c[aá]lculo|fra[cç][aã]o|matriz|vetor/i},{name:'Física',re:/f[ií]sica|cinem[aá]tica|din[aâ]mica|eletricidade|termologia|[oó]ptica/i},{name:'Química',re:/qu[ií]mica|mol[eé]cula|[aá]tomo|estequiometr|liga[cç][aã]o qu[ií]mica/i},{name:'Biologia',re:/biologia|gen[eé]tica|c[eé]lula|ecologia|evolu[cç][aã]o/i},{name:'História',re:/hist[oó]ria|revolu[cç][aã]o francesa|brasil col[oô]nia|idade m[eé]dia/i},{name:'Geografia',re:/geografia|cartografia|geopol[ií]tica|clima|relevo/i},{name:'Português',re:/portugu[eê]s|gram[aá]tica|sintaxe|interpreta[cç][aã]o de texto/i},{name:'Redação',re:/reda[cç][aã]o|texto dissertativo|argumenta[cç][aã]o/i},{name:'Literatura',re:/literatura|romantismo|modernismo|realismo liter[aá]rio/i},{name:'Inglês',re:/ingl[eê]s|english grammar|english lesson/i}];
function inferCategory(title){return categories.find(c=>c.re.test(title||''))?.name||''}
function ensureCategoryFolder(subject){let f=(db.folders||[]).find(f=>f.name.toLocaleLowerCase('pt-BR')===subject.toLocaleLowerCase('pt-BR'));if(!f){f={id:crypto.randomUUID(),name:subject,emoji:({'Matemática':'📐','Física':'⚡','Química':'🧪','Biologia':'🧬','História':'🏛️','Geografia':'🌎','Português':'📖','Redação':'✍️','Literatura':'📚','Inglês':'🌐'})[subject]||'📚',color:'#AA78D4'};db.folders=db.folders||[];db.folders.push(f)}return f.id}
function scheduleMetadata(){clearTimeout(metaTimer);let version=++metaVersion;metaTimer=setTimeout(()=>autoMetadata(version),550)}
async function autoMetadata(version){let input=el('matUrl'),u=safeUrl(input?.value||'');if(!u)return;let status=el('metaStatus');status.textContent='Buscando título e dados públicos do material…';let title='',author='';try{let resp=await fetch('https://noembed.com/embed?url='+encodeURIComponent(u));if(!resp.ok)throw Error('sem dados');let data=await resp.json();title=data.title||'';author=data.author_name||''}catch(e){}if(version!==metaVersion||!el('matUrl'))return;if(title){el('matTitle').value=title.slice(0,120);let subject=inferCategory(title);if(subject){el('matSubject').value=subject;let fid=ensureCategoryFolder(subject);let opt=el('matFolder');opt.innerHTML=folderOptions(fid);opt.value=fid;save()}if(!el('matNotes').value.trim())el('matNotes').value=('Material: '+title+'.'+(author?' Canal/autoria: '+author+'.':'')+' Descrição baseada no título; conteúdo completo não analisado.').slice(0,1000);status.textContent='✓ Título identificado'+(subject?' · Organizado em '+subject:'')+'. Revise antes de salvar.'}else{let subject=inferCategory(decodeURIComponent(new URL(u).pathname.replace(/[-_]/g,' ')));if(subject){el('matSubject').value=subject;let fid=ensureCategoryFolder(subject);el('matFolder').innerHTML=folderOptions(fid);el('matFolder').value=fid;save()}status.textContent='Não foi possível consultar o título automaticamente. Preencha manualmente ou tente outro link.'}}
function addMaterial(e){e.preventDefault();let url=el('matUrl').value.trim();if(url&&!safeUrl(url))return alert('Use um link http ou https.');let title=el('matTitle').value.trim()||'Material sem título';db.materials.push({id:crypto.randomUUID(),title,type:el('matType').value,folderId:el('matFolder').value,subject:el('matSubject').value.trim(),url,notes:el('matNotes').value.trim()});save();materiais()}
function removeMaterial(id){if(confirm('Excluir este material?')){db.materials=db.materials.filter(x=>x.id!==id);save();materiais()}}
render();
</script></body></html>
